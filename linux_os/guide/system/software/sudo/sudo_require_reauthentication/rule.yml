documentation_complete: true


title: 'Require Re-Authentication When Using the sudo Command'

description: |-
    The sudo <tt>timestamp_timeout</tt> tag sets the number of minutes after which
    sudo asks for the password again.
    Make sure that every <tt>timestamp_timeout</tt> setting in the
    <tt>/etc/sudoers</tt> configuration file and in the sudo configuration snippets
    in <tt>/etc/sudoers.d/</tt> is between 0 and
    {{{ xccdf_value("var_sudo_timestamp_timeout") }}}, and that at most one
    <tt>Defaults</tt> entry for all users sets it.
    Without such an entry, sudo uses the default it was built with: 5 minutes,
    and 15 minutes on Debian and Ubuntu. This default must not exceed
    {{{ xccdf_value("var_sudo_timestamp_timeout") }}} either.
    sudo skips the files of <tt>/etc/sudoers.d/</tt> whose names contain a
    <tt>.</tt> or end in <tt>~</tt>, and so does the check.
    If the value is set to an integer less than 0, the user's time stamp will not expire
    and the user will not have to re-authenticate for privileged actions until the user's session is terminated.

rationale: |-
    Without re-authentication, users may access resources or perform tasks for which they
    do not have authorization.
    <br /><br />
    When operating systems provide the capability to escalate a functional capability, it
    is critical that the user re-authenticate.

severity: medium

