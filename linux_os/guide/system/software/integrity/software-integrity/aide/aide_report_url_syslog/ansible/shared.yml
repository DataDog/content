# platform = multi_platform_all
# reboot = false
# strategy = restrict
# complexity = low
# disruption = low

- name: "{{{ rule_title }}} - Find a syslog report_url"
  ansible.builtin.lineinfile:
    path: "{{{ aide_conf_path }}}"
    regexp: '^\s*report_url\s*=\s*syslog:'
    state: absent
  check_mode: true
  changed_when: false
  register: aide_report_url_syslog

- name: "{{{ rule_title }}} - Add a syslog report_url"
  ansible.builtin.lineinfile:
    path: "{{{ aide_conf_path }}}"
    line: report_url=syslog:LOG_LOCAL0
    insertafter: '^\s*report_url\s*='
  when: aide_report_url_syslog.found == 0
