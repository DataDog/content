documentation_complete: true

title: 'Ensure the System Wide Crypto Policy Disables CBC Ciphers for SSH'

description: |-
    The system wide crypto policy has to disable the Cipher Block Chaining (CBC)
    mode ciphers for SSH. The rule reads the resolved policy that
    <tt>update-crypto-policies</tt> writes to
    <tt>/etc/crypto-policies/state/CURRENT.pol</tt> when it applies a policy.
    In that file, the <tt>cipher@libssh</tt>, <tt>cipher@openssh</tt>,
    <tt>cipher@openssh-client</tt> and <tt>cipher@openssh-server</tt> lines give the
    ciphers of the SSH back-ends where they differ from the global <tt>cipher</tt> line.
    A <tt>cipher@openssh</tt> line covers both the OpenSSH client and server, and an SSH
    back-end that no SSH cipher line covers uses the global <tt>cipher</tt> line.
    The file has to exist, and
    {{% if product == "rhel8" %}}
    either its global <tt>cipher</tt> line lists no CBC cipher, or its SSH cipher lines
    cover libssh, the OpenSSH client and the OpenSSH server and none of them lists a
    CBC cipher.
    {{% else %}}
    its SSH cipher lines have to list no CBC cipher. When the global <tt>cipher</tt> line
    lists a CBC cipher, the SSH cipher lines have to cover libssh, the OpenSSH client
    and the OpenSSH server.
    {{% endif %}}

    To disable the CBC ciphers for SSH, add the following line to
    <tt>/etc/crypto-policies/policies/modules/NO-SSHCBC.pmod</tt>:
    <pre>cipher@SSH = -*-CBC</pre>
    Then add the <tt>NO-SSHCBC</tt> subpolicy to the system wide crypto policy,
    together with the subpolicies already in use, for example:
    <pre>$ sudo update-crypto-policies --set DEFAULT:NO-SSHCBC</pre>

rationale: |-
    SSH messages encrypted with a cipher in CBC mode are vulnerable to an attack that
    recovers up to 32 bits of plaintext from an arbitrary block of ciphertext
    (CVE-2008-5161).

severity: medium

identifiers:
    cce@rhel8: CCE-88578-0
    cce@rhel9: CCE-88622-6
    cce@rhel10: CCE-88668-9

ocil_clause: 'the system wide crypto policy enables a CBC cipher for SSH'

ocil: |-
    To verify that the resolved system wide crypto policy disables the CBC ciphers for
    SSH, run the following command:
    <pre>$ sudo grep -Pi '^\s*cipher(@(lib|open)ssh(-server|-client)?)?\s*=' /etc/crypto-policies/state/CURRENT.pol</pre>
    {{% if product == "rhel8" %}}
    Either the <tt>cipher</tt> line should list no cipher ending in <tt>-CBC</tt>, or
    no <tt>cipher@</tt> line should list a cipher ending in <tt>-CBC</tt> and the
    command should return a <tt>cipher@libssh</tt> line, a <tt>cipher@openssh-client</tt>
    or <tt>cipher@openssh</tt> line, and a <tt>cipher@openssh-server</tt> or
    <tt>cipher@openssh</tt> line.
    {{% else %}}
    No <tt>cipher@</tt> line should list a cipher ending in <tt>-CBC</tt>. If the
    <tt>cipher</tt> line lists a cipher ending in <tt>-CBC</tt>, the command should
    also return a <tt>cipher@libssh</tt> line, a <tt>cipher@openssh-client</tt> or
    <tt>cipher@openssh</tt> line, and a <tt>cipher@openssh-server</tt> or
    <tt>cipher@openssh</tt> line.
    {{% endif %}}

platform: package[crypto-policies]
