documentation_complete: true

title: 'Verify Owner on the rsyslog Drop-In Directory'

description: |-
    The <tt>/etc/rsyslog.d</tt> directory should be owned by <tt>root</tt>.

rationale: |-
    A user who can write to the drop-in directory can add a configuration file
    that rsyslog loads at its next start.

severity: medium

identifiers:
    cce@rhel8: CCE-87833-0
    cce@rhel9: CCE-87834-8
    cce@rhel10: CCE-87839-7

ocil_clause: '/etc/rsyslog.d is not owned by root'

ocil: |-
    To find the files or directories that do not comply, run the following command:
    <pre>$ sudo find /etc/rsyslog.d -maxdepth 0 -type d ! -user root</pre>
    The command should return no output.

fixtext: |-
    Run the following command:
    $ sudo chown root /etc/rsyslog.d

template:
    name: file_owner
    vars:
        filepath: /etc/rsyslog.d/
        uid_or_name: '0'
