documentation_complete: true

title: 'Verify Group Who Owns the rsyslog Drop-In Directory'

description: |-
    The <tt>/etc/rsyslog.d</tt> directory should be group-owned by <tt>root</tt>.

rationale: |-
    A user who can write to the drop-in directory can add a configuration file
    that rsyslog loads at its next start.

severity: medium

identifiers:
    cce@rhel8: CCE-87840-5
    cce@rhel9: CCE-87845-4
    cce@rhel10: CCE-87846-2

ocil_clause: '/etc/rsyslog.d is not group-owned by root'

ocil: |-
    To find the files or directories that do not comply, run the following command:
    <pre>$ sudo find /etc/rsyslog.d -maxdepth 0 -type d ! -group root</pre>
    The command should return no output.

fixtext: |-
    Run the following command:
    $ sudo chgrp root /etc/rsyslog.d

template:
    name: file_groupowner
    vars:
        filepath: /etc/rsyslog.d/
        gid_or_name: '0'
