documentation_complete: true

title: 'Verify Owner on the rsyslog Work Directory'

description: |-
    The rsyslog work directory <tt>/var/lib/rsyslog</tt> should be owned by
    <tt>root</tt>.

rationale: |-
    The work directory holds the rsyslog queue files and state, which contain
    log messages not yet written or forwarded. Other users must not read or
    alter them.

severity: medium

identifiers:
    cce@rhel8: CCE-87853-8
    cce@rhel9: CCE-87854-6
    cce@rhel10: CCE-87855-3

ocil_clause: '/var/lib/rsyslog is not owned by root'

ocil: |-
    To find the files or directories that do not comply, run the following command:
    <pre>$ sudo find /var/lib/rsyslog -maxdepth 0 -type d ! -user root</pre>
    The command should return no output.

fixtext: |-
    Run the following command:
    $ sudo chown root /var/lib/rsyslog

template:
    name: file_owner
    vars:
        filepath: /var/lib/rsyslog/
        uid_or_name: '0'
