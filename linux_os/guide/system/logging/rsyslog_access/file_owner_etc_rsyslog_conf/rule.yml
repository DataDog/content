documentation_complete: true

title: 'Verify Owner on rsyslog Configuration Files'

description: |-
    The <tt>/etc/rsyslog.conf</tt> file and the <tt>.conf</tt> files in
    <tt>/etc/rsyslog.d/</tt> should be owned by <tt>root</tt>.

rationale: |-
    The rsyslog configuration decides which messages are kept, where they go and
    which remote hosts may send messages. A user who can change it can hide
    activity from the logs or send them elsewhere.

severity: medium

identifiers:
    cce@rhel8: CCE-87816-5
    cce@rhel9: CCE-87819-9
    cce@rhel10: CCE-87820-7

ocil_clause: 'a configuration file is not owned by root'

ocil: |-
    To find the files or directories that do not comply, run the following command:
    <pre>$ sudo find /etc/rsyslog.conf /etc/rsyslog.d/ -maxdepth 1 -type f -name '*.conf' ! -user root</pre>
    The command should return no output.

fixtext: |-
    Run the following command:
    $ sudo chown root /etc/rsyslog.conf /etc/rsyslog.d/*.conf

template:
    name: file_owner
    vars:
        filepath:
            - /etc/
            - /etc/rsyslog.d/
        file_regex:
            - ^(.*/)?rsyslog\.conf$
            - ^.*\.conf$
        uid_or_name: '0'
