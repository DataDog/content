documentation_complete: true

title: 'Verify Permissions on rsyslog Configuration Files'

description: |-
    The <tt>/etc/rsyslog.conf</tt> file and the <tt>.conf</tt> files in
    <tt>/etc/rsyslog.d/</tt> should have mode <tt>0640</tt> or less permissive.

rationale: |-
    The rsyslog configuration decides which messages are kept, where they go and
    which remote hosts may send messages. A user who can change it can hide
    activity from the logs or send them elsewhere.

severity: medium

identifiers:
    cce@rhel8: CCE-87828-0
    cce@rhel9: CCE-87830-6
    cce@rhel10: CCE-87832-2

ocil_clause: 'a configuration file has a mode more permissive than 0640'

ocil: |-
    To find the files or directories that do not comply, run the following command:
    <pre>$ sudo find /etc/rsyslog.conf /etc/rsyslog.d/ -maxdepth 1 -type f -name '*.conf' -perm /7137</pre>
    The command should return no output.

fixtext: |-
    Run the following command:
    $ sudo chmod u-xs,g-wxs,o-rwxt /etc/rsyslog.conf /etc/rsyslog.d/*.conf

template:
    name: file_permissions
    vars:
        filepath:
            - /etc/
            - /etc/rsyslog.d/
        file_regex:
            - ^(.*/)?rsyslog\.conf$
            - ^.*\.conf$
        filemode: '0640'
