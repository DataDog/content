documentation_complete: true

title: 'Verify User Who Owns /var/log/*.journal(~) Files'

description: |-
    To properly set the owner of the journal files under <code>/var/log</code>,
    <code>*.journal</code> and <code>*.journal~</code>, run the command:
    <pre>$ sudo find /var/log -type f \( -name '*.journal' -o -name '*.journal~' \) -exec chown root {} +</pre>

rationale: |-
    The <tt>/var/log/*.journal(~)</tt> files are system logs managed by the "systemd" service.

severity: medium

ocil_clause: '{{{ ocil_clause_file_owner(file="/var/log/*.journal(~)", owner="root") }}}'

ocil: |-
    To check the ownership of the journal files under <code>/var/log</code>, run the command:
    <pre>$ sudo find /var/log -type f \( -name '*.journal' -o -name '*.journal~' \) -exec ls -lL {} +</pre>
    If properly configured, the output should indicate the following owner:
    <code>root</code>

fixtext: |-
    To properly set the owner of the journal files under <code>/var/log</code>,
    <code>*.journal</code> and <code>*.journal~</code>, run the command:
    <pre>$ sudo find /var/log -type f \( -name '*.journal' -o -name '*.journal~' \) -exec chown root {} +</pre>

srg_requirement: '{{{ srg_requirement_file_owner("/var/log/*.journal(~)", owner="root") }}}'

template:
    name: file_owner
    vars:
        filepath: /var/log/
        file_regex: .*\.journal(~)?$
        uid_or_name: '0'
        recursive: true
