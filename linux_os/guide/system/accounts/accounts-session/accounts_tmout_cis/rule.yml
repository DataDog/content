documentation_complete: true

title: 'Set Interactive Session Timeout for CIS Benchmark'

{{% if product == "al2023" %}}
{{% set tmout_files = "/etc/bashrc /etc/profile /etc/profile.d/*.sh" %}}
{{% elif product in ["rhel9", "almalinux9"] %}}
{{% set tmout_files = "/etc/*bashrc /etc/profile /etc/profile.d/*.sh /etc/profile.d/sh.local /usr/etc/profile.d/*.sh /usr/etc/profile.d/sh.local" %}}
{{% else %}}
{{% set tmout_files = "/etc/*bashrc /etc/profile /etc/profile.d/*.sh" %}}
{{% endif %}}

description: |-
    The <tt>TMOUT</tt> variable sets the number of seconds after which an idle
    interactive shell exits.
    {{% if product == "al2023" %}}
    The CIS Benchmark requires one of the files <tt>{{{ tmout_files }}}</tt> to set
    <tt>TMOUT</tt> to a value from 1 to {{{ xccdf_value("var_accounts_tmout") }}} and
    to mark it read only and exported with the <tt>readonly</tt> and <tt>export</tt>
    commands. None of the files may set <tt>TMOUT</tt> to 0 or to a value above
    {{{ xccdf_value("var_accounts_tmout") }}}.
    {{% elif product in ["rhel9", "almalinux9"] %}}
    The CIS Benchmark requires at least one of the files <tt>{{{ tmout_files }}}</tt>
    to set <tt>TMOUT</tt>, and every file that sets it to set a value from 1 to
    {{{ xccdf_value("var_accounts_tmout") }}}, to mark it read only and to export it.
    <tt>typeset -xr TMOUT</tt> does all three, as do the <tt>readonly</tt> and
    <tt>export</tt> commands.
    {{% else %}}
    The CIS Benchmark requires at least one of the files <tt>{{{ tmout_files }}}</tt>
    to set <tt>TMOUT</tt>, and every file that mentions it to set a value from 1 to
    {{{ xccdf_value("var_accounts_tmout") }}}, to mark it read only and to export it.
    <tt>typeset -xr TMOUT</tt> does all three, as do the <tt>readonly</tt> and
    <tt>export</tt> commands.
    {{% endif %}}
    For example, add the following line to <tt>/etc/profile.d/tmout.sh</tt>:
    <pre>readonly TMOUT={{{ xccdf_value("var_accounts_tmout") }}} ; export TMOUT</pre>

rationale: |-
    Terminating an idle session within a short time period reduces
    the window of opportunity for unauthorized personnel to take control of a
    management session enabled on the console or console port that has been
    left unattended.

severity: medium

ocil_clause: 'TMOUT is unset, out of range, or not marked read only and exported in the same file'

ocil: |-
    Run the following command to list the <tt>TMOUT</tt> settings:
    <pre>$ sudo grep -s TMOUT {{{ tmout_files }}}</pre>
    {{% if product == "al2023" %}}
    One file has to set <tt>TMOUT</tt> to a value from 1 to
    {{{ xccdf_value("var_accounts_tmout") }}} and contain <tt>readonly TMOUT</tt> and
    <tt>export TMOUT</tt>, and no file may set <tt>TMOUT</tt> to 0 or to a value above
    {{{ xccdf_value("var_accounts_tmout") }}}.
    {{% else %}}
    At least one file has to set <tt>TMOUT</tt>, and every file that
    {{{ "sets" if product in ["rhel9", "almalinux9"] else "mentions" }}} it has to set a
    value from 1 to {{{ xccdf_value("var_accounts_tmout") }}} and mark it read only and
    exported, with <tt>typeset -xr TMOUT</tt> or with the <tt>readonly</tt> and
    <tt>export</tt> commands.
    {{% endif %}}

fixtext: |-
    Configure {{{ full_name }}} to terminate idle shell sessions after {{{ xccdf_value("var_accounts_tmout") }}} seconds.

    Add the following line to "/etc/profile.d/tmout.sh":

    readonly TMOUT={{{ xccdf_value("var_accounts_tmout") }}} ; export TMOUT

platform: system_with_kernel
