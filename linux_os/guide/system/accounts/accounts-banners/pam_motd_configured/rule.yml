documentation_complete: true

title: 'Ensure pam_motd Message Files Omit System Information'

description: |-
    The message files that the <tt>pam_motd.so</tt> entries of the sshd,
    login, su and gdm-password PAM services name with <tt>motd=</tt> must be
    free of the <tt>\v</tt>, <tt>\r</tt>, <tt>\m</tt> and <tt>\s</tt> escape
    sequences and of the operating system ID of <tt>/etc/os-release</tt>.

rationale: |-
    A login message that shows the operating system and its release helps an
    attacker pick exploits for the system.

severity: medium

platform: package[pam]

ocil_clause: 'a message file named by pam_motd discloses system information'

ocil: |-
    Review the active <tt>pam_motd.so</tt> entries of the sshd, login, su, and
    gdm-password PAM services. The readable files they name with
    <tt>motd=PATH</tt> must not contain <tt>\v</tt>, <tt>\r</tt>,
    <tt>\m</tt>, <tt>\s</tt>, or the operating system ID.
