documentation_complete: true

title: 'Configure Access to pam_motd Message Files'

description: |-
    The files that the lines of <tt>/etc/pam.d</tt> name with
    <tt>motd=PATH</tt>, commented lines included, must be owned by root,
    group-owned by root, and have mode 0644 or more restrictive.

rationale: |-
    Restrictive ownership and permissions prevent unauthorized modification of
    text displayed to users at login.

severity: medium

platform: package[pam]

requires:
    - pam_motd_configured

ocil_clause: 'a referenced pam_motd file is not root-owned or is more permissive than 0644'

ocil: |-
    List the paths that the lines of <tt>/etc/pam.d</tt> name with
    <tt>motd=PATH</tt>, and verify that each existing one is owned by
    root:root with mode 0644 or more restrictive.
