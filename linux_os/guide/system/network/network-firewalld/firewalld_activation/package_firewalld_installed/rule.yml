{{{ complete_ocil_entry_package_installed("firewalld") }}}

fixtext: |-
    To install the "firewalld" package run the following command:

    {{{ package_install("firewalld") }}}

{{%- if product in [ "sle12", "sle15" ] %}}
template:
    name: package_installed_guard_var
    vars:
        pkgname: firewalld
        variable: var_network_filtering_service
        value: firewalld
{{%- elif product in ["rhel8", "rhel9", "rhel10", "almalinux9"] %}}
template:
    name: firewall_utility_installed
    vars:
        utility: firewalld
{{%- else %}}
template:
    name: package_installed
    vars:
        pkgname: firewalld
{{%- endif %}}


srg_requirement:
    {{{ full_name }}} must have the firewalld package installed.
