# platform = multi_platform_all
# reboot = false
# strategy = configure
# complexity = low
# disruption = low
{{{ ansible_instantiate_variables("var_multiple_time_servers") }}}

- name: "Check if chrony main config has active server/pool entries"
  ansible.builtin.command:
    cmd: grep -q '^[[:space:]]*\(server\|pool\)[[:space:]]\+[[:graph:]]\+' {{{ chrony_conf_path }}}
  register: chrony_conf_has_servers
  changed_when: false
  failed_when: false

- name: "Extract sourcedir paths from chrony configuration"
  ansible.builtin.shell:
    cmd: |-
      set -o pipefail
      grep '^[[:space:]]*sourcedir[[:space:]]\+' {{{ chrony_conf_path }}} | awk '{print $2}'
    executable: /bin/bash
  register: chrony_sourcedir_paths
  changed_when: false
  failed_when: false
  when: chrony_conf_has_servers.rc != 0

- name: "Check for server/pool entries in sourcedir .sources files"
  ansible.builtin.shell:
    cmd: |
      for dir in {{ chrony_sourcedir_paths.stdout_lines | join(' ') }}; do
        if [ -d "$dir" ]; then
          grep -q -e '^[[:space:]]*server[[:space:]]\+[[:graph:]]\+' -e '^[[:space:]]*pool[[:space:]]\+[[:graph:]]\+' "$dir"/*.sources 2>/dev/null && exit 0
        fi
      done
      exit 1
  register: chrony_sourcedir_has_servers
  changed_when: false
  failed_when: false
  when:
    - chrony_conf_has_servers.rc != 0
    - chrony_sourcedir_paths.stdout_lines | length > 0

- name: "Extract confdir paths from chrony configuration"
  ansible.builtin.shell:
    cmd: |-
      set -o pipefail
      grep '^[[:space:]]*confdir[[:space:]]\+' {{{ chrony_conf_path }}} | awk '{print $2}'
    executable: /bin/bash
  register: chrony_confdir_paths
  changed_when: false
  failed_when: false
  when:
    - chrony_conf_has_servers.rc != 0
    - (chrony_sourcedir_paths.stdout_lines | default([]) | length == 0 or chrony_sourcedir_has_servers.rc != 0)

- name: "Check for server/pool entries in confdir .conf files"
  ansible.builtin.shell:
    cmd: |
      for dir in {{ chrony_confdir_paths.stdout_lines | join(' ') }}; do
        if [ -d "$dir" ]; then
          grep -q -e '^[[:space:]]*server[[:space:]]\+[[:graph:]]\+' -e '^[[:space:]]*pool[[:space:]]\+[[:graph:]]\+' "$dir"/*.conf 2>/dev/null && exit 0
        fi
      done
      exit 1
  register: chrony_confdir_has_servers
  changed_when: false
  failed_when: false
  when:
    - chrony_conf_has_servers.rc != 0
    - chrony_confdir_paths.stdout_lines | default([]) | length > 0
    - (chrony_sourcedir_paths.stdout_lines | default([]) | length == 0 or chrony_sourcedir_has_servers.rc != 0)

- name: "Select the sourcedir paths outside /run, a tmpfs that starts empty at boot"
  ansible.builtin.set_fact:
    chrony_persistent_sourcedirs: "{{ chrony_sourcedir_paths.stdout_lines | default([]) | reject('match', '/(var/)?run/') | list }}"

- name: "Select 60-cis.sources in the first of these sourcedirs, or else the main chrony configuration"
  ansible.builtin.set_fact:
    chrony_servers_file: "{{ chrony_persistent_sourcedirs[0] ~ '/60-cis.sources' if chrony_persistent_sourcedirs | length > 0 else '{{{ chrony_conf_path }}}' }}"

- name: "Create sourcedir directory if needed"
  ansible.builtin.file:
    path: "{{ chrony_persistent_sourcedirs[0] }}"
    state: directory
    mode: '0755'
  when:
    - chrony_conf_has_servers.rc != 0
    - (chrony_sourcedir_paths.stdout_lines | default([]) | length == 0 or chrony_sourcedir_has_servers.rc != 0)
    - (chrony_confdir_paths.stdout_lines | default([]) | length == 0 or chrony_confdir_has_servers.rc != 0)
    - chrony_persistent_sourcedirs | length > 0

- name: "Check if the file for remote time servers exists"
  ansible.builtin.stat:
    path: "{{ chrony_servers_file }}"
  register: chrony_servers_file_stat

- name: "Comment out server entries that name none of the remote time servers"
  ansible.builtin.replace:
    path: "{{ chrony_servers_file }}"
    regexp: '^[ \t]*server(?=[ \t])(?![ \t]+(?:{{ var_multiple_time_servers.split(",") | map("regex_escape") | join("|") }})(?:[ \t]|$))'
    replace: '# server'
  when:
    - chrony_conf_has_servers.rc != 0
    - (chrony_sourcedir_paths.stdout_lines | default([]) | length == 0 or chrony_sourcedir_has_servers.rc != 0)
    - (chrony_confdir_paths.stdout_lines | default([]) | length == 0 or chrony_confdir_has_servers.rc != 0)
    - chrony_servers_file_stat.stat.exists

- name: "Add remote time servers to 60-cis.sources or the main chrony configuration"
  ansible.builtin.lineinfile:
    path: "{{ chrony_servers_file }}"
    line: 'server {{ item }}'
    state: present
    create: true
    mode: '0644'
  loop: '{{ var_multiple_time_servers.split(",") }}'
  when:
    - chrony_conf_has_servers.rc != 0
    - (chrony_sourcedir_paths.stdout_lines | default([]) | length == 0 or chrony_sourcedir_has_servers.rc != 0)
    - (chrony_confdir_paths.stdout_lines | default([]) | length == 0 or chrony_confdir_has_servers.rc != 0)
