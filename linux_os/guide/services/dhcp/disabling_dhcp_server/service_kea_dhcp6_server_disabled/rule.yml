documentation_complete: true

{{% if product in ["rhel10", "sle16"] %}}
{{% set kea_service = "kea-dhcp6" %}}
{{% else %}}
{{% set kea_service = "kea-dhcp6-server" %}}
{{% endif %}}

title: 'Disable kea-dhcp6-server Service'

description: |-
    The <tt>{{{ kea_service }}}</tt> service should be disabled on
    any system that does not need to act as a DHCPv6 server.
    {{{ describe_service_disable(service=kea_service) }}}

rationale: |-
    Unmanaged or unintentionally activated DHCP servers may provide faulty information
    to clients, interfering with the operation of a legitimate site
    DHCP server if there is one.

severity: medium

identifiers:
    cce@rhel10: CCE-88710-9
    cce@sle16: CCE-96112-8

ocil_clause: |-
    {{{ ocil_clause_service_disabled(service=kea_service) }}}

ocil: |-
    {{{ ocil_service_disabled(service=kea_service) }}}

platform: system_with_kernel

template:
    name: service_disabled
    vars:
        servicename: kea-dhcp6-server
        servicename@rhel10: kea-dhcp6
        servicename@sle16: kea-dhcp6
        packagename: kea
