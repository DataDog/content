documentation_complete: true

title: 'Disable SSH Key Exchange Algorithms Prohibited by CIS'

description: |-
    The SSH server must not offer the key exchange algorithms that the CIS
    benchmarks list as weak:
    <pre>{{{ sshd_cis_weak_kex() }}}</pre>
{{%- if product == "rhel7" %}}
    The OpenSSH 7.4 of RHEL 7 rejects a list that removes algorithms from the
    defaults. Set the allowed key exchange algorithms in a
    <tt>KexAlgorithms</tt> line ahead of any other in the SSH server
    configuration, as the benchmark does:
    <pre>KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256</pre>
{{%- else %}}
    Where a system-wide crypto policy governs the SSH server, remove them
    through the policy. Elsewhere, a subtractive list ahead of any other
    <tt>KexAlgorithms</tt> line in the SSH server configuration removes them
    from the defaults:
    <pre>KexAlgorithms -{{{ sshd_cis_weak_kex() }}}</pre>
{{%- endif %}}
    The check reads the list that <tt>sshd -T</tt> prints, which reflects the
    defaults, the crypto policy and the configuration files.

rationale: |-
    These methods hash the key exchange with SHA-1, whose collision
    resistance is broken, and <tt>diffie-hellman-group1-sha1</tt> uses a
    1024-bit group. A weak key exchange exposes the session to
    man-in-the-middle attacks.

severity: medium

identifiers:
    cce@rhel8: CCE-88615-0
    cce@rhel9: CCE-88658-0
    cce@rhel10: CCE-88704-2

platform: package[openssh-server]

ocil_clause: 'the effective SSH key exchange list contains a prohibited algorithm'

ocil: |-
    Print the key exchange algorithms that the SSH server offers:
    {{%- if product == "rhel8" %}}
    <pre>$ sudo bash -c '. /etc/crypto-policies/back-ends/opensshserver.config; . /etc/sysconfig/sshd; sshd -T $OPTIONS $CRYPTO_POLICY' | grep '^kexalgorithms '</pre>
    {{%- else %}}
    <pre>$ sudo sshd -T | grep '^kexalgorithms '</pre>
    {{%- endif %}}
    The list must not contain any of the algorithms above.
