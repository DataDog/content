documentation_complete: true

{{%- if product in ["rhel7", "ubuntu2004"] %}}
{{%- set at_groups = "root|daemon" %}}
{{%- else %}}
{{%- set at_groups = "root" %}}
{{%- endif %}}

title: 'Verify Group Who Owns /etc/at.allow file'

description: |-
    If <tt>/etc/at.allow</tt> exists, it must be group-owned by <tt>{{{ at_groups|replace("|", "</tt> or <tt>") }}}</tt>.
    {{{ describe_file_group_owner(file="/etc/at.allow", group=at_groups) }}}

rationale: |-
    If the owner of the at.allow file is not set to root, the possibility exists for an
    unauthorized user to view or edit sensitive information.

severity: medium

identifiers:
    cce@rhel7: CCE-86144-3
    cce@rhel8: CCE-87102-0
    cce@rhel9: CCE-87103-8
    cce@rhel10: CCE-90598-4
    cce@sle12: CCE-91685-8
    cce@sle15: CCE-91315-2
    cce@sle16: CCE-96128-4
    cce@slmicro5: CCE-93928-0

references:
    cis@sle12: 5.1.9
    cis@sle15: 5.1.9

ocil_clause: '{{{ ocil_clause_file_group_owner(file="/etc/at.allow", group=at_groups) }}}'

ocil: |-
    {{{ ocil_file_group_owner(file="/etc/at.allow", group=at_groups) }}}

platform: package[at]

template:
    name: file_groupowner
    vars:
        filepath: /etc/at.allow
{{%- if product in ["rhel7", "ubuntu2004"] %}}
        gid_or_name: 'root|daemon'
{{%- else %}}
        gid_or_name: '0'
{{%- endif %}}
