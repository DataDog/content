documentation_complete: true

{{%- if product == "rhel7" %}}
{{%- set at_groups = "root|daemon" %}}
{{%- else %}}
{{%- set at_groups = "root" %}}
{{%- endif %}}

title: 'Verify Group Who Owns /etc/at.deny file'

description: |-
    If <tt>/etc/at.deny</tt> exists, it must be group-owned by <tt>{{{ at_groups|replace("|", "</tt> or <tt>") }}}</tt>.
    {{{ describe_file_group_owner(file="/etc/at.deny", group=at_groups) }}}

rationale: |-
    If the owner of the at.deny file is not set to root, the possibility exists for an
    unauthorized user to view or edit sensitive information.

severity: medium

ocil_clause: '{{{ ocil_clause_file_group_owner(file="/etc/at.deny", group=at_groups) }}}'

ocil: |-
    {{{ ocil_file_group_owner(file="/etc/at.deny", group=at_groups) }}}

platform: package[at]

template:
    name: file_groupowner
    vars:
        filepath: /etc/at.deny
{{%- if product == "rhel7" %}}
        gid_or_name: 'root|daemon'
{{%- else %}}
        gid_or_name: '0'
{{%- endif %}}
