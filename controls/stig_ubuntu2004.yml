---
policy: Canonical Ubuntu 20.04 LTS Security Technical Implementation Guide (STIG)
title: Canonical Ubuntu 20.04 LTS Security Technical Implementation Guide (STIG)
id: stig_ubuntu2004
version: V2R4
source: https://www.cyber.mil/stigs/downloads/

levels:
    - id: high
    - id: medium
    - id: low

reference_type: stigid
product: ubuntu2004

controls:
    - id: UBTU-20-010000
      title: Ubuntu 20.04 LTS must provision temporary user accounts with an expiration time of 72 hours
          or less.
      levels:
          - medium
      rules:
          - account_temp_expire_date
      status: manual

    - id: UBTU-20-010001
      title: Ubuntu 20.04 LTS must be a vendor-supported release.
      levels:
          - high
      status: manual

    - id: UBTU-20-010002
      title: Ubuntu 20.04 LTS must enable the graphical user logon banner to display the Standard Mandatory
          DoD Notice and Consent Banner before granting local access to the system via a graphical user
          logon.
      levels:
          - medium
      rules:
          - dconf_gnome_banner_enabled
          - enable_dconf_user_profile
      status: automated

    - id: UBTU-20-010003
      title: Ubuntu 20.04 LTS must display the Standard Mandatory DOD Notice and Consent Banner before
          granting local access to the system via a graphical user logon.
      levels:
          - medium
      rules:
          - dconf_login_banner_text=dod_banners
          - dconf_login_banner_contents=dod_default
          - dconf_gnome_login_banner_text
      status: automated

    - id: UBTU-20-010004
      title: Ubuntu 20.04 LTS must retain a user's session lock until that user reestablishes access
          using established identification and authentication procedures.
      levels:
          - medium
      rules:
          - dconf_gnome_screensaver_lock_enabled
      status: automated

    - id: UBTU-20-010005
      title: Ubuntu 20.04 LTS must allow users to directly initiate a session lock for all connection
          types.
      levels:
          - medium
      rules:
          - vlock_installed
      status: automated

    - id: UBTU-20-010006
      title: Ubuntu 20.04 LTS must map the authenticated identity to the user or group account for PKI-based
          authentication.
      levels:
          - high
      rules:
          - verify_use_mappers
      status: automated

    - id: UBTU-20-010007
      title: Ubuntu 20.04 LTS must enforce 24 hours/1 day as the minimum password lifetime. Passwords
          for new users must have a 24 hours/1 day minimum password lifetime restriction.
      levels:
          - low
      rules:
          - var_accounts_minimum_age_login_defs=1
          - accounts_minimum_age_login_defs
      status: automated

    - id: UBTU-20-010008
      title: Ubuntu 20.04 LTS must enforce a 60-day maximum password lifetime restriction. Passwords
          for new users must have a 60-day maximum password lifetime restriction.
      levels:
          - low
      rules:
          - var_accounts_maximum_age_login_defs=60
          - accounts_maximum_age_login_defs
      status: automated

    - id: UBTU-20-010009
      title: Ubuntu 20.04 LTS when booted must require authentication upon booting into single-user and
          maintenance modes.
      levels:
          - high
      rules:
          - grub2_password
          - grub2_uefi_password
      status: automated

    - id: UBTU-20-010010
      title: Ubuntu 20.04 LTS must uniquely identify interactive users.
      levels:
          - medium
      rules:
          - no_duplicate_uids
      status: automated

    - id: UBTU-20-010012
      title: Ubuntu 20.04 LTS must ensure only users who need access to security functions are part of
          sudo group.
      levels:
          - high
      rules:
          - ensure_sudo_group_restricted
      status: automated

    - id: UBTU-20-010013
      title: Ubuntu 20.04 LTS must automatically terminate a user session after inactivity timeouts have
          expired.
      levels:
          - medium
      rules:
          - var_accounts_tmout=10_min
          - accounts_tmout
      status: automated

    - id: UBTU-20-010014
      title: Ubuntu 20.04 LTS must require users to reauthenticate for privilege escalation or when changing
          roles.
      levels:
          - medium
      rules:
          - sudo_remove_no_authenticate
      status: automated

    - id: UBTU-20-010015
      title: Ubuntu 20.04 LTS must require users to provide a password for privilege escalation.
      levels:
          - medium
      rules:
          - sudo_remove_nopasswd
      status: automated

    - id: UBTU-20-010016
      title: Ubuntu 20.04 LTS default filesystem permissions must be defined in such a way that all authenticated
          users can read and modify only their own files.
      levels:
          - medium
      rules:
          - var_accounts_user_umask=077
          - accounts_umask_etc_login_defs
      status: automated

    - id: UBTU-20-010017
      title: Ubuntu 20.04 LTS must restrict privilege elevation to authorized personnel.
      levels:
          - medium
      rules:
          - sudo_restrict_privilege_elevation_to_authorized
      status: automated

    - id: UBTU-20-010018
      title: Ubuntu 20.04 LTS must have the "SSSD" package installed.
      levels:
          - medium
      rules:
          - package_nss_sss_installed
          - package_pam_sss_installed
          - package_sssd_installed
      status: automated

    - id: UBTU-20-010019
      title: Ubuntu 20.04 LTS must use the "SSSD" package for multifactor authentication services.
      levels:
          - medium
      rules:
          - service_sssd_enabled
      status: automated

    - id: UBTU-20-010020
      title: Ubuntu 20.04 LTS must ensure SSSD performs certificate path validation, including revocation
          checking, against a trusted anchor for PKI-based authentication.
      levels:
          - medium
      rules:
          - sssd_certification_path_trust_anchor
          - sssd_enable_pam_services
          - sssd_enable_smartcards
      status: automated

    - id: UBTU-20-010021
      title: Ubuntu 20.04 LTS must be configured such that Pluggable Authentication Module (PAM) prohibits
          the use of cached authentications after one day.
      levels:
          - low
      rules:
          - sssd_offline_cred_expiration
      status: automated

    - id: UBTU-20-010022
      title: Ubuntu 20.04 LTS must map the authenticated identity to the user or group account for PKI-based
          authentication.
      levels:
          - high
      rules:
          - sssd_enable_user_cert
      status: automated

    - id: UBTU-20-010033
      title: Ubuntu 20.04 LTS must implement smart card logins for multifactor authentication for local
          and network access to privileged and nonprivileged accounts.
      levels:
          - medium
      rules:
          - smartcard_pam_enabled
          - sshd_enable_pubkey_auth
      status: automated

    - id: UBTU-20-010035
      title: Ubuntu 20.04 LTS must use strong authenticators in establishing nonlocal maintenance and
          diagnostic sessions.
      levels:
          - medium
      rules:
          - sshd_enable_pam
      status: automated

    - id: UBTU-20-010036
      title: Ubuntu 20.04 LTS must immediately terminate all network connections associated with SSH
          traffic after a period of inactivity.
      levels:
          - medium
      rules:
          - var_sshd_set_keepalive=1
          - sshd_set_keepalive
      status: automated

    - id: UBTU-20-010037
      title: Ubuntu 20.04 LTS must immediately terminate all network connections associated with SSH
          traffic at the end of the session or after 10 minutes of inactivity.
      levels:
          - medium
      rules:
          - sshd_idle_timeout_value=10_minutes
          - sshd_set_idle_timeout
      status: automated

    - id: UBTU-20-010038
      title: Ubuntu 20.04 LTS must display the Standard Mandatory DOD Notice and Consent Banner before
          granting any local or remote connection to the system.
      levels:
          - medium
      rules:
          - remote_login_banner_text=dod_banners
          - remote_login_banner_contents=dod_default
          - banner_etc_issue_net
          - sshd_enable_warning_banner_net
      status: automated

    - id: UBTU-20-010042
      title: Ubuntu 20.04 LTS must use SSH to protect the confidentiality and integrity of transmitted
          information.
      levels:
          - high
      rules:
          - package_openssh-server_installed
          - service_sshd_enabled
      status: automated

    - id: UBTU-20-010043
      title: Ubuntu 20.04 LTS must configure the SSH daemon to use Message Authentication Codes (MACs)
          employing FIPS 140-2 approved cryptographic hashes to prevent the unauthorized disclosure of
          information and/or detect changes to information during transmission.
      levels:
          - medium
      rules:
          - sshd_use_approved_macs_ordered_stig
      status: automated

    - id: UBTU-20-010044
      title: Ubuntu 20.04 LTS must configure the SSH daemon to use FIPS 140-2 approved ciphers to prevent
          the unauthorized disclosure of information and/or detect changes to information during transmission.
      levels:
          - medium
      rules:
          - sshd_use_approved_ciphers_ordered_stig
      status: automated

    - id: UBTU-20-010045
      title: Ubuntu 20.04 LTS SSH server must be configured to use only FIPS-validated key exchange algorithms.
      levels:
          - medium
      rules:
          - sshd_use_approved_kex_ordered_stig
      status: automated

    - id: UBTU-20-010047
      title: Ubuntu 20.04 LTS must not allow unattended or automatic login via SSH.
      levels:
          - high
      rules:
          - sshd_disable_empty_passwords
          - sshd_do_not_permit_user_env
      status: automated

    - id: UBTU-20-010048
      title: Ubuntu 20.04 LTS must be configured so that remote X connections are disabled, unless to
          fulfill documented and validated mission requirements.
      levels:
          - high
      rules:
          - sshd_disable_x11_forwarding
      status: automated

    - id: UBTU-20-010049
      title: Ubuntu 20.04 LTS SSH daemon must prevent remote hosts from connecting to the proxy display.
      levels:
          - medium
      rules:
          - sshd_x11_use_localhost
      status: automated

    - id: UBTU-20-010050
      title: Ubuntu 20.04 LTS must enforce password complexity by requiring that at least one upper-case
          character be used.
      levels:
          - low
      rules:
          - var_password_pam_ucredit=1
          - accounts_password_pam_ucredit
      status: automated

    - id: UBTU-20-010051
      title: Ubuntu 20.04 LTS must enforce password complexity by requiring that at least one lower-case
          character be used.
      levels:
          - low
      rules:
          - var_password_pam_lcredit=1
          - accounts_password_pam_lcredit
      status: automated

    - id: UBTU-20-010052
      title: Ubuntu 20.04 LTS must enforce password complexity by requiring that at least one numeric
          character be used.
      levels:
          - low
      rules:
          - var_password_pam_dcredit=1
          - accounts_password_pam_dcredit
      status: automated

    - id: UBTU-20-010053
      title: Ubuntu 20.04 LTS must require the change of at least 8 characters when passwords are changed.
      levels:
          - low
      rules:
          - var_password_pam_difok=8
          - accounts_password_pam_difok
      status: automated

    - id: UBTU-20-010054
      title: Ubuntu 20.04 LTS must enforce a minimum 15-character password length.
      levels:
          - medium
      rules:
          - var_password_pam_minlen=15
          - accounts_password_pam_minlen
      status: automated

    - id: UBTU-20-010055
      title: Ubuntu 20.04 LTS must enforce password complexity by requiring that at least one special
          character be used.
      levels:
          - low
      rules:
          - var_password_pam_ocredit=1
          - accounts_password_pam_ocredit
      status: automated

    - id: UBTU-20-010056
      title: Ubuntu 20.04 LTS must prevent the use of dictionary words for passwords.
      levels:
          - medium
      rules:
          - var_password_pam_dictcheck=1
          - accounts_password_pam_dictcheck
      status: automated

    - id: UBTU-20-010057
      title: Ubuntu 20.04 LTS must be configured so that when passwords are changed or new passwords
          are established, pwquality must be used.
      levels:
          - medium
      rules:
          - var_password_pam_retry=3
          - accounts_password_pam_enforcing
          - accounts_password_pam_retry
          - package_pam_pwquality_installed
      status: automated

    - id: UBTU-20-010060
      title: Ubuntu 20.04 LTS, for PKI-based authentication, must validate certificates by constructing
          a certification path (which includes status information) to an accepted trust anchor.
      levels:
          - medium
      rules:
          - smartcard_configure_ca
      status: automated

    - id: UBTU-20-010063
      title: Ubuntu 20.04 LTS must implement multifactor authentication for remote access to privileged
          accounts in such a way that one of the factors is provided by a device separate from the system
          gaining access.
      levels:
          - medium
      rules:
          - install_smartcard_packages
      status: automated

    - id: UBTU-20-010064
      title: Ubuntu 20.04 LTS must accept Personal Identity Verification (PIV) credentials.
      levels:
          - medium
      rules:
          - package_opensc_installed
      status: automated

    - id: UBTU-20-010065
      title: Ubuntu 20.04 LTS must electronically verify Personal Identity Verification (PIV) credentials.
      levels:
          - medium
      rules:
          - smartcard_configure_cert_checking
      status: automated

    - id: UBTU-20-010066
      title: Ubuntu 20.04 LTS for PKI-based authentication, must implement a local cache of revocation
          data in case of the inability to access revocation information via the network.
      levels:
          - medium
      rules:
          - smartcard_configure_crl
      status: automated

    - id: UBTU-20-010070
      title: Ubuntu 20.04 LTS must prohibit password reuse for a minimum of five generations.
      levels:
          - low
      rules:
          - var_password_pam_unix_remember=5
          - accounts_password_pam_unix_remember
      status: automated

    - id: UBTU-20-010072
      title: Ubuntu 20.04 LTS must automatically lock an account until the locked account is released
          by an administrator when three unsuccessful logon attempts have been made.
      levels:
          - low
      rules:
          - var_accounts_passwords_pam_faillock_deny=3
          - var_accounts_passwords_pam_faillock_fail_interval=900
          - var_accounts_passwords_pam_faillock_unlock_time=never
          - accounts_passwords_pam_faillock_audit
          - accounts_passwords_pam_faillock_deny
          - accounts_passwords_pam_faillock_interval
          - accounts_passwords_pam_faillock_silent
          - accounts_passwords_pam_faillock_unlock_time
      status: automated

    - id: UBTU-20-010074
      title: Ubuntu 20.04 LTS must be configured so that the script which runs each 30 days or less to
          check file integrity is the default one.
      levels:
          - medium
      rules:
          - aide_periodic_cron_checking
      status: automated

    - id: UBTU-20-010075
      title: Ubuntu 20.04 LTS must enforce a delay of at least 4 seconds between logon prompts following
          a failed logon attempt.
      levels:
          - low
      rules:
          - var_password_pam_delay=4000000
          - accounts_passwords_pam_faildelay_delay
      status: automated

    - id: UBTU-20-010100
      title: Ubuntu 20.04 LTS must generate audit records for all account creations, modifications, disabling,
          and termination events that affect /etc/passwd.
      levels:
          - medium
      rules:
          - audit_rules_usergroup_modification_passwd
      status: automated

    - id: UBTU-20-010101
      title: Ubuntu 20.04 LTS must generate audit records for all account creations, modifications, disabling,
          and termination events that affect /etc/group.
      levels:
          - medium
      rules:
          - audit_rules_usergroup_modification_group
      status: automated

    - id: UBTU-20-010102
      title: Ubuntu 20.04 LTS must generate audit records for all account creations, modifications, disabling,
          and termination events that affect /etc/shadow.
      levels:
          - medium
      rules:
          - audit_rules_usergroup_modification_shadow
      status: automated

    - id: UBTU-20-010103
      title: Ubuntu 20.04 LTS must generate audit records for all account creations, modifications, disabling,
          and termination events that affect /etc/gshadow.
      levels:
          - medium
      rules:
          - audit_rules_usergroup_modification_gshadow
      status: automated

    - id: UBTU-20-010104
      title: Ubuntu 20.04 LTS must generate audit records for all account creations, modifications, disabling,
          and termination events that affect /etc/opasswd.
      levels:
          - medium
      rules:
          - audit_rules_usergroup_modification_opasswd
      status: automated

    - id: UBTU-20-010105
      title: Ubuntu 20.04 LTS must audit any script or executable called by cron as root or by any privileged
          user.
      levels:
          - medium
      rules:
          - audit_rules_etc_cron_d
          - audit_rules_var_spool_cron
      status: automated

    - id: UBTU-20-010117
      title: Ubuntu 20.04 LTS must alert the ISSO and SA (at a minimum) in the event of an audit processing
          failure.
      levels:
          - medium
      rules:
          - var_auditd_action_mail_acct=root
          - auditd_data_retention_action_mail_acct
      status: automated

    - id: UBTU-20-010118
      title: Ubuntu 20.04 LTS must shut down by default upon audit failure (unless availability is an
          overriding concern).
      levels:
          - medium
      rules:
          - var_auditd_disk_full_action=halt
          - auditd_data_disk_full_action
      status: automated

    - id: UBTU-20-010122
      title: Ubuntu 20.04 LTS must be configured so that audit log files are not read or write-accessible
          by unauthorized users.
      levels:
          - medium
      rules:
          - file_permissions_var_log_audit_stig
      status: automated

    - id: UBTU-20-010123
      title: Ubuntu 20.04 LTS must be configured to permit only authorized users ownership of the audit
          log files.
      levels:
          - medium
      rules:
          - file_ownership_var_log_audit_stig
      status: automated

    - id: UBTU-20-010124
      title: Ubuntu 20.04 LTS must permit only authorized groups ownership of the audit log files.
      levels:
          - medium
      rules:
          - file_group_ownership_var_log_audit_stig
      status: automated

    - id: UBTU-20-010128
      title: Ubuntu 20.04 LTS must be configured so that the audit log directory is not write-accessible
          by unauthorized users.
      levels:
          - medium
      rules:
          - directory_permissions_var_log_audit
      status: automated

    - id: UBTU-20-010133
      title: Ubuntu 20.04 LTS must be configured so that audit configuration files are not write-accessible
          by unauthorized users.
      levels:
          - medium
      rules:
          - file_permissions_etc_audit_auditd
          - file_permissions_etc_audit_rules
          - file_permissions_etc_audit_rulesd
      status: automated

    - id: UBTU-20-010134
      title: Ubuntu 20.04 LTS must permit only authorized accounts to own the audit configuration files.
      levels:
          - medium
      rules:
          - file_ownership_audit_configuration
      status: automated

    - id: UBTU-20-010135
      title: Ubuntu 20.04 LTS must permit only authorized groups to own the audit configuration files.
      levels:
          - medium
      rules:
          - file_groupownership_audit_configuration
      status: automated

    - id: UBTU-20-010136
      title: Ubuntu 20.04 LTS must generate audit records for successful/unsuccessful uses of the su
          command.
      levels:
          - medium
      rules:
          - audit_rules_privileged_commands_su
      status: automated

    - id: UBTU-20-010137
      title: Ubuntu 20.04 LTS must generate audit records for successful/unsuccessful uses of the chfn
          command.
      levels:
          - medium
      rules:
          - audit_rules_privileged_commands_chfn
      status: automated

    - id: UBTU-20-010138
      title: Ubuntu 20.04 LTS must generate audit records for successful/unsuccessful uses of the mount
          command.
      levels:
          - medium
      rules:
          - audit_rules_privileged_commands_mount
      status: automated

    - id: UBTU-20-010139
      title: Ubuntu 20.04 LTS must generate audit records for successful/unsuccessful uses of the umount
          command.
      levels:
          - medium
      rules:
          - audit_rules_privileged_commands_umount
      status: automated

    - id: UBTU-20-010140
      title: Ubuntu 20.04 LTS must generate audit records for successful/unsuccessful uses of the ssh-agent
          command.
      levels:
          - medium
      rules:
          - audit_rules_privileged_commands_ssh_agent
      status: automated

    - id: UBTU-20-010141
      title: Ubuntu 20.04 LTS must generate audit records for successful/unsuccessful uses of the ssh-keysign
          command.
      levels:
          - medium
      rules:
          - audit_rules_privileged_commands_ssh_keysign
      status: automated

    - id: UBTU-20-010142
      title: Ubuntu 20.04 LTS must generate audit records for any use of the setxattr, fsetxattr, lsetxattr,
          removexattr, fremovexattr, and lremovexattr system calls.
      levels:
          - medium
      rules:
          - audit_rules_dac_modification_fremovexattr
          - audit_rules_dac_modification_fsetxattr
          - audit_rules_dac_modification_lremovexattr
          - audit_rules_dac_modification_lsetxattr
          - audit_rules_dac_modification_removexattr
          - audit_rules_dac_modification_setxattr
      status: automated

    - id: UBTU-20-010148
      title: Ubuntu 20.04 LTS must generate audit records for successful/unsuccessful uses of the chown,
          fchown, fchownat, and lchown system calls.
      levels:
          - medium
      rules:
          - audit_rules_dac_modification_chown
          - audit_rules_dac_modification_fchown
          - audit_rules_dac_modification_fchownat
          - audit_rules_dac_modification_lchown
      status: automated

    - id: UBTU-20-010152
      title: Ubuntu 20.04 LTS must generate audit records for successful/unsuccessful uses of the chmod,
          fchmod, and fchmodat system calls.
      levels:
          - medium
      rules:
          - audit_rules_dac_modification_chmod
          - audit_rules_dac_modification_fchmod
          - audit_rules_dac_modification_fchmodat
      status: automated

    - id: UBTU-20-010155
      title: Ubuntu 20.04 LTS must generate audit records for successful/unsuccessful uses of the creat,
          open, openat, open_by_handle_at, truncate, and ftruncate system calls.
      levels:
          - medium
      rules:
          - audit_rules_unsuccessful_file_modification_creat
          - audit_rules_unsuccessful_file_modification_ftruncate
          - audit_rules_unsuccessful_file_modification_open
          - audit_rules_unsuccessful_file_modification_open_by_handle_at
          - audit_rules_unsuccessful_file_modification_openat
          - audit_rules_unsuccessful_file_modification_truncate
      status: automated

    - id: UBTU-20-010161
      title: Ubuntu 20.04 LTS must generate audit records for successful/unsuccessful uses of the sudo
          command.
      levels:
          - medium
      rules:
          - audit_rules_privileged_commands_sudo
      status: automated

    - id: UBTU-20-010162
      title: Ubuntu 20.04 LTS must generate audit records for successful/unsuccessful uses of the sudoedit
          command.
      levels:
          - medium
      rules:
          - audit_rules_privileged_commands_sudoedit
      status: automated

    - id: UBTU-20-010163
      title: Ubuntu 20.04 LTS must generate audit records for successful/unsuccessful uses of the chsh
          command.
      levels:
          - medium
      rules:
          - audit_rules_privileged_commands_chsh
      status: automated

    - id: UBTU-20-010164
      title: Ubuntu 20.04 LTS must generate audit records for successful/unsuccessful uses of the newgrp
          command.
      levels:
          - medium
      rules:
          - audit_rules_privileged_commands_newgrp
      status: automated

    - id: UBTU-20-010165
      title: Ubuntu 20.04 LTS must generate audit records for successful/unsuccessful uses of the chcon
          command.
      levels:
          - medium
      rules:
          - audit_rules_execution_chcon
      status: automated

    - id: UBTU-20-010166
      title: Ubuntu 20.04 LTS must generate audit records for successful/unsuccessful uses of the apparmor_parser
          command.
      levels:
          - medium
      rules:
          - audit_rules_privileged_commands_apparmor_parser
      status: automated

    - id: UBTU-20-010167
      title: Ubuntu 20.04 LTS must generate audit records for successful/unsuccessful uses of the setfacl
          command.
      levels:
          - medium
      rules:
          - audit_rules_execution_setfacl
      status: automated

    - id: UBTU-20-010168
      title: Ubuntu 20.04 LTS must generate audit records for successful/unsuccessful uses of the chacl
          command.
      levels:
          - medium
      rules:
          - audit_rules_execution_chacl
      status: automated

    - id: UBTU-20-010169
      title: Ubuntu 20.04 LTS must generate audit records for the use and modification of the tallylog
          file.
      levels:
          - medium
      rules:
          - audit_rules_login_events_tallylog
      status: automated

    - id: UBTU-20-010170
      title: Ubuntu 20.04 LTS must generate audit records for the use and modification of faillog file.
      levels:
          - medium
      rules:
          - audit_rules_login_events_faillog
      status: automated

    - id: UBTU-20-010171
