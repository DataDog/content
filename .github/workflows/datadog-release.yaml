name: Datadog Release
on:
  push:
    branches: ['datadog']
    tags: ['v*.*.*-dd.*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: Check the datadog branch
    if: github.repository == 'DataDog/content'
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora@sha256:a32cc6149ce88510a5e23ce249d42681d61758d5851c398d29a76e5c94d1ed72
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install Deps
        run: dnf install -y git python3-pyyaml
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test the tooling
        run: python3 -m unittest discover -s .datadog/tests
      - name: Check that datadog holds every branch of the list, cherry-picked
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 .datadog/datadog.py --remote origin check --trailers "$GITHUB_SHA"
      - name: Name the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(python3 -c 'import yaml; print(yaml.safe_load(open(".datadog/branches.yml"))["base"])')
          date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d "$base")
          curl -sfS -H "Authorization: Bearer $GH_TOKEN" -o "$RUNNER_TEMP/releases.json" \
            "https://api.github.com/repos/ComplianceAsCode/content/releases?per_page=100"
          release=$(python3 - "$RUNNER_TEMP/releases.json" "$(git log -1 --format=%ct "$base")" <<'EOF'
          import datetime
          import json
          import sys
          # The latest release is the newest one upstream published before
          # the base: release tags sit on stabilization branches, off master.
          path, base = sys.argv[1], int(sys.argv[2])
          best = None
          for r in json.load(open(path)):
              if r["draft"] or r["prerelease"] or not r["published_at"]:
                  continue
              t = datetime.datetime.fromisoformat(r["published_at"].replace("Z", "+00:00"))
              if t.timestamp() <= base and (best is None or t > best[0]):
                  best = (t, r["tag_name"])
          if best is None:
              sys.exit("upstream published its releases after the base")
          print(best[1])
          EOF
          )
          case "$GITHUB_REF" in
          refs/tags/*)
            tag=${GITHUB_REF#refs/tags/}
            test "$(git rev-parse "$GITHUB_SHA")" = "$(git rev-parse refs/remotes/origin/datadog)" ||
              { echo "$tag does not point at the head of datadog"; exit 1; }
            case "$tag" in
            "$release-dd.$date".*) ;;
            *) echo "$tag should start with $release-dd.$date (latest upstream release, base date)"; exit 1 ;;
            esac
            code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag")
            test "$code" = 404 ||
              { echo "$tag: the release exists already (HTTP $code), so tag the next N"; exit 1; }
            ;;
          *)
            tag=$release-dd.$date.0
            ;;
          esac
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          python3 .datadog/datadog.py --remote origin notes "$tag" notes --rev "$GITHUB_SHA"
      - name: Keep the notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes/
          retention-days: 14
  build:
    name: Build the CIS products
    needs: check
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora@sha256:a32cc6149ce88510a5e23ce249d42681d61758d5851c398d29a76e5c94d1ed72
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Install Deps
        run: dnf install -y cmake ninja-build openscap-utils python3-pip python3-devel gcc-c++ ansible ansible-lint libxslt git
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install python deps
        run: pip install -r requirements-base.txt -r test-requirements.txt
      - name: Pin the build time to the commit time
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DSSG_PRODUCT_DEFAULT=OFF \
            -DSSG_PRODUCT_RHEL7=ON -DSSG_PRODUCT_RHEL8=ON -DSSG_PRODUCT_RHEL9=ON \
            -DSSG_PRODUCT_RHEL10=ON -DSSG_PRODUCT_ALMALINUX9=ON -DSSG_PRODUCT_AL2023=ON \
            -DSSG_PRODUCT_UBUNTU2004=ON -DSSG_PRODUCT_UBUNTU2204=ON -DSSG_PRODUCT_UBUNTU2404=ON \
            -DSSG_CENTOS_DERIVATIVES_ENABLED=OFF -DSSG_AMZN_DERIVATIVES_ENABLED=ON \
            -DSSG_VERSION_OVERRIDE="$VERSION"
      - name: Build
        run: ninja -C build all
      - name: Build the zip
        run: ninja -C build zipfile
      - name: Test
        run: ctest --test-dir build -L quick --output-on-failure
      - name: Check the zip
        run: |
          python3 - "build/zipfile/scap-security-guide-$VERSION.zip" "$VERSION" <<'EOF'
          import re
          import sys
          import zipfile
          path, version = sys.argv[1:]
          products = ["rhel7", "amzn2", "rhel8", "rhel9", "rhel10", "almalinux9", "al2023",
                      "ubuntu2004", "ubuntu2204", "ubuntu2404"]
          z = zipfile.ZipFile(path)
          names = {n.rsplit("/", 1)[-1]: n for n in z.namelist()}
          for p in products:
              ds = names["ssg-%s-ds.xml" % p]
              text = z.read(ds).decode()
              m = re.search(r"<xccdf-1\.2:version update=\"[^\"]*\">([^<]*)<", text)
              if not m or m.group(1) != version:
                  sys.exit("%s: XCCDF version %s, want %s" % (ds, m and m.group(1), version))
          print("zip holds the data streams of %s, version %s" % (", ".join(products), version))
          EOF
      - name: Keep the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zip
          path: |
            build/zipfile/scap-security-guide-*.zip
            build/zipfile/scap-security-guide-*.zip.sha512
          retention-days: 14
  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Fetch the zip and the notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            zip/scap-security-guide-*.zip
            zip/scap-security-guide-*.zip.sha512
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "SCAP Security Guide $VERSION" --notes-file notes/notes.md \
            "zip/scap-security-guide-$VERSION.zip" "zip/scap-security-guide-$VERSION.zip.sha512" \
            notes/manifest.json
