# Conflicts of ubuntu2004-product when .datadog/datadog.py picks it onto datadog:
# the texts that replace each conflict block, in order.
linux_os/guide/system/permissions/files/permissions_local_var_log/rule.yml:
  - |2
            excluded_files@al2023: ['[bw]tmp', '[bw]tmp.*', '[bw]tmp-*', 'lastlog', 'lastlog.*']
            excluded_files@ubuntu2004: ['history.log*', 'eipp.log.xz*', '[bw]tmp', '[bw]tmp.*', '[bw]tmp-*', 'lastlog', 'lastlog.*']
  - |2
            recursive@al2023: 'true'
            recursive@ubuntu2004: 'true'
linux_os/guide/services/ssh/ssh_server/sshd_use_approved_kex_ordered_stig/oval/shared.xml:
  - "{{% elif product in ['ol7', 'rhel7', 'sle12', 'sle15', 'slmicro5', 'slmicro6', 'ubuntu2004'] %}}"
